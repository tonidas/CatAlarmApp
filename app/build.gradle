plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def cronitorProperties = new Properties()
def cronitorPropertiesFile = rootProject.file('app.properties')
if (cronitorPropertiesFile.exists()) {
    cronitorPropertiesFile.withInputStream { cronitorProperties.load(it) }
}

def toBuildConfigString = { value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.ton.catalarm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ton.catalarm'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'

        buildConfigField 'String', 'CRONITOR_API_KEY', toBuildConfigString(cronitorProperties.getProperty('CRONITOR_API_KEY', ''))
        buildConfigField 'String', 'CRONITOR_MONITOR_KEY', toBuildConfigString(cronitorProperties.getProperty('CRONITOR_MONITOR_KEY', 'cat-alarm-app'))
        buildConfigField 'String', 'CRONITOR_ENV', toBuildConfigString(cronitorProperties.getProperty('CRONITOR_ENV', 'production'))

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so' // An Android Archive (AAR) file contains an Android library. If the .so file exists in multiple AAR files, select the first AAR file.
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    def camerax_version = '1.3.4'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.camera:camera-core:' + camerax_version
    implementation 'androidx.camera:camera-camera2:' + camerax_version
    implementation 'androidx.camera:camera-lifecycle:' + camerax_version
    implementation 'androidx.camera:camera-view:' + camerax_version
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}
